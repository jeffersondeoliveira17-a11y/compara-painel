<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Página não encontrada · Compara Painel</title>
<style>
:root{--bg:#102532;--fg:#fff;--mut:#a9bac6;--btn:#F4BE51}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
main{text-align:center;max-width:460px}
img{width:min(78vw,380px);height:auto;display:block;margin:0 auto 28px}
h1{margin:0 0 8px;font-size:22px;font-weight:600}
p{margin:0 0 26px;color:var(--mut);line-height:1.5}
a{display:inline-block;background:var(--btn);color:#102532;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:999px}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="/compara-painel/icones/error-404.svg" alt="Error 404" width="380" height="150">
<h1>Página não encontrada</h1>
<p>O endereço que você abriu não existe ou mudou de lugar.</p>
<a href="/compara-painel/">Voltar ao painel</a>
</main>
</body>
</html>
